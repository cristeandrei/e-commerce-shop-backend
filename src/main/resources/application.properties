spring.application.name=shop

spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true

spring.flyway.locations=classpath:db/migration,classpath:db/dev_data

management.observations.annotations.enabled=true
management.otlp.metrics.export.url=http://host.docker.internal:4318/v1/metrics
management.opentelemetry.tracing.export.otlp.endpoint=http://host.docker.internal:4318/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=http://host.docker.internal:4318/v1/logs

server.servlet.session.cookie.same-site=Lax
springdoc.swagger-ui.csrf.enabled=true
server.servlet.session.cookie.secure=false
